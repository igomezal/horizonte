{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="horizonte-assets" content="{{assets}}">
  <title>{{t .TitleKey}} · {{t "app.name"}}</title>
  <script src="{{asset "/static/js/theme-init.js"}}"></script>
  <link rel="icon" href="{{asset "/static/img/favicon.svg"}}" type="image/svg+xml">
  <link rel="preload" href="{{asset "/static/fonts/jetbrains-mono-latin-wght.woff2"}}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{asset "/static/vendor/pico.min.css"}}">
  <link rel="stylesheet" href="{{asset "/static/css/app.css"}}">
  {{- with .Sentry}}{{if .DSN}}
  <script src="{{asset "/static/vendor/sentry.tracing.replay.logs.min.js"}}"></script>
  <script src="{{asset "/static/js/sentry-init.js"}}" data-dsn="{{.DSN}}" data-environment="{{.Environment}}" data-release="{{.Release}}"></script>
  {{- end}}{{end}}
  <script src="{{asset "/static/vendor/htmx.min.js"}}" defer></script>
  <script src="{{asset "/static/js/charts.js"}}" data-echarts="{{asset "/static/vendor/echarts.min.js"}}" defer></script>
  <script src="{{asset "/static/js/app.js"}}" defer></script>
  <script src="{{asset "/static/vendor/alpine.min.js"}}" defer></script>
</head>
<body hx-boost="true" x-data="{ navOpen: false }">
  <div class="nav-progress" aria-hidden="true"></div>
  <div class="shell">
    {{template "sidebar" .}}
    <div class="main">
      {{template "topbar" .}}
      <main id="content" class="container-fluid">
        {{template "content" .}}
      </main>
      <footer class="app-footer">
        <small>{{t "footer.privacy"}}</small>
      </footer>
    </div>
  </div>
  <div class="toast" data-toast role="status" aria-live="polite"
       data-text-offline="{{t "conn.toast_offline"}}" data-text-online="{{t "conn.toast_online"}}">
    <p data-toast-text></p>
    <button type="button" class="icon-btn" data-toast-dismiss aria-label="{{t "toast.dismiss"}}">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</body>
</html>
{{end}}
