{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{t .TitleKey}} · {{t "app.name"}}</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/instrument-sans-latin-wdth.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  {{- with .Sentry}}{{if .DSN}}
  <script src="/static/vendor/sentry.tracing.replay.logs.min.js"></script>
  <script src="/static/js/sentry-init.js" data-dsn="{{.DSN}}" data-environment="{{.Environment}}" data-release="{{.Release}}"></script>
  {{- end}}{{end}}
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/echarts.min.js" defer></script>
  <script src="/static/js/charts.js" defer></script>
  <script src="/static/js/app.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body hx-boost="true" x-data="{ navOpen: false }">
  <div class="nav-progress" aria-hidden="true"></div>
  <div class="shell">
    {{template "sidebar" .}}
    <div class="main">
      {{template "topbar" .}}
      <main id="content" class="container-fluid">
        {{template "content" .}}
      </main>
      <footer class="app-footer">
        <small>{{t "footer.privacy"}}</small>
      </footer>
    </div>
  </div>
</body>
</html>
{{end}}
